<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>仿生人会梦见电子烟吗</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="仿生人会梦见电子烟吗">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#EEF2F1;
  --paper:#FBF9F6;
  --paper-soft:#F4F1EC;
  --ink:#1B2422;
  --muted:#6B7572;
  --line:#DCE3E0;
  --ember:#FF6B35;
  --ember-deep:#E0501C;
  --amber:#D9A24B;
  --sage:#6E8C82;
  --sage-soft:#DCE6E2;
  --danger:#C24B3F;
  --radius:18px;
  --shadow: 0 1px 2px rgba(27,36,34,0.04), 0 8px 24px -8px rgba(27,36,34,0.10);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

/* ---- header ---- */
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.icon-btn{
  background:var(--paper);border:1px solid var(--line);
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);flex:none;
}
.icon-btn:hover{border-color:var(--sage);color:var(--sage);}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.14em;
  color:var(--sage);
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.eyebrow::before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:var(--ember);
  box-shadow:0 0 0 3px rgba(255,107,53,0.18);
}
h1.title{
  font-family:'Space Grotesk',sans-serif;
  font-size:32px;
  font-weight:700;
  margin:0 0 18px;
  letter-spacing:-0.01em;
}

.stat-strip{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  padding:16px 20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat .num{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;}
.stat .lbl{font-size:11.5px;color:var(--muted);}

/* ---- tabs ---- */
.tabs-row{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
  padding:9px 16px;border-radius:11px;
  background:var(--paper);border:1px solid var(--line);
  color:var(--muted);cursor:pointer;
}
.tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---- toolbar ---- */
.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
  align-items:center;
}
.search-box{
  flex:1 1 220px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:11px 14px 11px 38px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--paper);
  font-family:'Inter',sans-serif;
  font-size:14px;
  color:var(--ink);
  outline:none;
}
.search-box input:focus{border-color:var(--sage);}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}

select.sort-select{
  padding:11px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--paper);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  color:var(--ink);
  outline:none;
  cursor:pointer;
}

.btn-primary{
  background:var(--ember);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:background .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn-primary:hover{background:var(--ember-deep);}
.btn-primary:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.6;cursor:default;}

/* ---- tag filter chips ---- */
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.tag-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:6px 11px;
  border-radius:999px;
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--muted);
  cursor:pointer;
  user-select:none;
}
.tag-chip.active{
  background:var(--sage);
  color:#fff;
  border-color:var(--sage);
}

/* ---- grid ---- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:16px;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(27,36,34,0.06), 0 16px 32px -10px rgba(27,36,34,0.14);}

.card .wisp{
  position:absolute;
  top:-18px;right:-18px;
  width:90px;height:90px;
  opacity:0.55;
  pointer-events:none;
}

.swatch-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.swatch{
  width:30px;height:30px;border-radius:9px;flex:none;
  border:1px solid rgba(0,0,0,0.06);
}
.card-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16.5px;line-height:1.25;}
.card-brand{font-size:12.5px;color:var(--muted);margin-top:1px;}
.author-tag{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--sage);background:var(--sage-soft);
  padding:2px 8px;border-radius:999px;
  display:inline-block;margin-top:6px;
}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.chip{
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  background:var(--sage-soft);
  color:var(--sage);
  padding:3px 9px;
  border-radius:999px;
}

.meta-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin:10px 0 12px;
  font-family:'IBM Plex Mono',monospace;
}

/* vapor meter (signature rating element) */
.meter-wrap{display:flex;align-items:center;gap:10px;}
.meter-score{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:20px;
  flex:none;
  min-width:38px;
}
.meter-track{
  flex:1;
  height:9px;
  border-radius:999px;
  background:var(--paper-soft);
  border:1px solid var(--line);
  position:relative;
  overflow:visible;
}
.meter-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg, var(--amber), var(--ember));
  position:relative;
}
.meter-wisp{
  position:absolute;
  right:-9px;top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;
  opacity:0.9;
}

.rebuy-tag{
  position:absolute;
  top:14px;right:14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  padding:3px 8px;
  border-radius:999px;
  font-weight:600;
  letter-spacing:0.02em;
}
.rebuy-会{background:#E4F1EC;color:#3F7A63;}
.rebuy-还行{background:#FBF1DE;color:#9C7A26;}
.rebuy-不会{background:#F7E6E3;color:var(--danger);}

/* ---- empty / cta state ---- */
.empty, .cta-box{
  text-align:center;
  padding:60px 20px;
  background:var(--paper);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  grid-column:1/-1;
}
.empty svg, .cta-box svg{width:64px;height:64px;margin-bottom:14px;opacity:0.6;}
.empty h3, .cta-box h3{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;font-size:18px;}
.empty p, .cta-box p{color:var(--muted);font-size:14px;margin:0 0 18px;}

.loading-state{
  grid-column:1/-1;text-align:center;padding:60px 20px;
  color:var(--muted);font-size:14px;
}

/* ---- overlay / panel ---- */
.overlay{
  position:fixed;inset:0;
  background:rgba(27,36,34,0.32);
  backdrop-filter:blur(2px);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:32px 16px;
  z-index:50;
  overflow-y:auto;
}
.overlay.open{display:flex;}
.panel{
  background:var(--paper);
  border-radius:22px;
  max-width:560px;
  width:100%;
  padding:28px 26px 26px;
  box-shadow:0 24px 60px -10px rgba(0,0,0,0.25);
  margin-bottom:32px;
}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px;}
.panel-head h2{font-family:'Space Grotesk',sans-serif;font-size:21px;margin:0;}
.close-btn{
  background:var(--paper-soft);
  border:none;width:32px;height:32px;border-radius:50%;
  cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);
}
.close-btn:hover{background:var(--sage-soft);color:var(--sage);}

.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:6px;
  font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;
  letter-spacing:0.03em;
}
.field input[type=text], .field input[type=number], .field input[type=date], .field textarea{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
  font-family:'Inter',sans-serif;
  font-size:14px;
  color:var(--ink);
  outline:none;
}
.field input:focus, .field textarea:focus{border-color:var(--sage);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}

.code-row{display:flex;gap:8px;align-items:center;}
.code-row input{flex:1;}
.copy-btn{
  background:var(--paper-soft);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);
  flex:none;font-family:'Inter',sans-serif;
}
.copy-btn:hover{border-color:var(--sage);}
.hint-text{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}

.readonly-banner{
  font-size:12.5px;color:var(--muted);
  background:var(--paper-soft);border-radius:10px;
  padding:9px 12px;margin-bottom:14px;
  font-family:'IBM Plex Mono',monospace;
}

.color-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.color-dot{
  width:28px;height:28px;border-radius:8px;
  cursor:pointer;border:2px solid transparent;
}
.color-dot.selected{border-color:var(--ink);}
.color-dot.custom-wrap{
  position:relative;width:28px;height:28px;border-radius:8px;
  overflow:hidden;border:1px dashed var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.color-dot.custom-wrap input[type=color]{
  position:absolute;width:50px;height:50px;top:-11px;left:-11px;
  cursor:pointer;border:none;padding:0;
}

.dots-row{display:flex;gap:6px;}
.dot-btn{
  width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--line);
  background:#fff;
  cursor:pointer;
}
.dot-btn.filled{background:var(--amber);border-color:var(--amber);}

.range-row{display:flex;align-items:center;gap:12px;}
.range-row input[type=range]{flex:1;accent-color:var(--ember);}
.range-score{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:18px;
  min-width:40px;text-align:right;
}

.segmented{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.segmented button{
  flex:1;padding:9px 0;
  background:#fff;border:none;
  font-family:'Inter',sans-serif;font-size:13.5px;
  cursor:pointer;color:var(--muted);
  border-right:1px solid var(--line);
}
.segmented button:last-child{border-right:none;}
.segmented button.active{background:var(--sage);color:#fff;}

.photo-field{display:flex;align-items:center;gap:12px;}
.photo-preview{
  width:64px;height:64px;border-radius:12px;
  background:var(--paper-soft);
  border:1px solid var(--line);
  object-fit:cover;
  flex:none;
}
.photo-btn{
  font-family:'Inter',sans-serif;
  font-size:13px;font-weight:600;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 14px;
  cursor:pointer;
  color:var(--ink);
}
.photo-btn:hover{border-color:var(--sage);}
.photo-remove{font-size:12px;color:var(--danger);cursor:pointer;background:none;border:none;text-decoration:underline;}

.panel-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;}
.btn-danger{
  background:none;border:none;color:var(--danger);
  font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
  cursor:pointer;padding:8px 4px;
}
.btn-save{
  background:var(--ember);color:#fff;border:none;
  border-radius:12px;padding:12px 22px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
  cursor:pointer;
}
.btn-save:hover{background:var(--ember-deep);}
.btn-save:disabled{opacity:0.6;cursor:default;}

/* detail view */
.detail-photo{
  width:100%;height:160px;border-radius:14px;
  object-fit:cover;margin-bottom:16px;
  background:var(--paper-soft);
}
.detail-score-block{
  display:flex;align-items:center;gap:16px;
  background:var(--paper-soft);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:16px;
}
.detail-sub-scores{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.sub-score-line{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;}
.sub-score-line .sub-label{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;}
.detail-notes{
  font-size:14px;line-height:1.65;
  background:var(--paper-soft);
  border-radius:14px;padding:14px 16px;
  white-space:pre-wrap;
  margin-bottom:16px;
}
.detail-meta-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-bottom:16px;
  font-size:13px;
}
.detail-meta-grid div span{display:block;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:2px;}

.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:999px;
  font-size:13.5px;
  opacity:0;
  transition:opacity .2s ease, transform .2s ease;
  z-index:100;
  pointer-events:none;
  max-width:80vw;
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:520px){
  .wrap{padding:20px 14px 70px;}
  h1.title{font-size:26px;}
  .field-row{flex-direction:column;}
  .stat-strip{gap:16px;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header-row">
    <div>
      <div class="eyebrow">PERSONAL VAPOR LOG</div>
      <h1 class="title">仿生人会梦见电子烟吗</h1>
    </div>
    <div class="icon-btn" id="settingsBtn" title="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
  </div>

  <div class="stat-strip" id="statStrip"></div>

  <div class="tabs-row" id="tabsRow"></div>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="搜索品牌 / 名称 / 口味...">
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="date_desc">最近添加</option>
      <option value="score_desc">评分从高到低</option>
      <option value="score_asc">评分从低到高</option>
      <option value="price_asc">价格从低到高</option>
      <option value="price_desc">价格从高到低</option>
      <option value="name_asc">名称 A-Z</option>
    </select>
    <button class="btn-primary" id="addBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      新建测评
    </button>
  </div>

  <div class="tag-row" id="tagRow"></div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SWATCHES = ['#E9C46A','#F4A261','#E76F51','#8AB17D','#5B8C85','#6C7FB8','#B07CC6','#D9D9D9'];
const SUPABASE_URL = 'https://zrwjpnjnqlqxbzisxvgs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1lLLhR94YW3sxhjqEnf3Wg_8IzZvKQU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let entries = [];
let activeTag = null;
let editingId = null;
let pendingPhoto = null;
let activeRoom = 'personal'; // 'personal' | 'shared'
let isLoading = false;
let config = { nickname:'', personalCode:'', groupCode:'' };

const grid = document.getElementById('grid');
const statStrip = document.getElementById('statStrip');
const tagRow = document.getElementById('tagRow');
const tabsRow = document.getElementById('tabsRow');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const toastEl = document.getElementById('toast');

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
}
function randomCode(){
  return (Math.random().toString(36).slice(2,6) + Math.random().toString(36).slice(2,6)).toLowerCase();
}
function copyToClipboard(text){
  if(!text){ showToast('内容是空的'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制')).catch(()=>showToast('复制失败，请手动选中复制'));
  }else{
    showToast('复制失败，请手动选中复制');
  }
}

const wispSVG = (opacity=1) => `<svg class="wisp" viewBox="0 0 100 100" style="opacity:${opacity}"><path d="M10 60 Q20 35 45 40 Q55 20 75 30 Q95 35 88 55 Q98 70 80 75 Q60 88 40 75 Q15 78 10 60Z" fill="#6E8C82" opacity="0.18"/></svg>`;
const meterWispSVG = `<svg class="meter-wisp" viewBox="0 0 24 24"><path d="M3 15 Q5 9 11 10 Q14 4 19 8 Q23 10 20 14 Q24 18 18 19 Q12 22 7 19 Q1 19 3 15Z" fill="#FF6B35"/></svg>`;
const emptyCloudSVG = `<svg viewBox="0 0 100 60" fill="none"><path d="M20 45 Q15 28 35 30 Q42 14 60 22 Q80 18 78 35 Q92 38 85 50 Q75 58 55 53 Q35 60 22 52 Q10 50 20 45Z" stroke="#6E8C82" stroke-width="2.5"/></svg>`;

/* ---------- local config (device settings only: nickname + room codes) ---------- */
function loadConfig(){
  try{
    const raw = localStorage.getItem('vape-config');
    config = raw ? JSON.parse(raw) : { nickname:'', personalCode:'', groupCode:'' };
  }catch(e){
    config = { nickname:'', personalCode:'', groupCode:'' };
  }
}
function saveConfig(){
  try{ localStorage.setItem('vape-config', JSON.stringify(config)); }catch(e){}
}
function currentRoomCode(){
  return activeRoom === 'personal' ? config.personalCode : config.groupCode;
}

/* ---------- cloud storage (Supabase) ---------- */
async function loadEntries(){
  const code = currentRoomCode();
  if(!code){ entries = []; render(); return; }
  isLoading = true;
  render();
  try{
    const { data, error } = await sb.from('entries').select('*').eq('room_code', code).order('created_at', { ascending:false });
    if(error) throw error;
    entries = (data||[]).map(row => ({
      ...row.data,
      id: row.id,
      author: row.author,
      createdAt: new Date(row.created_at).getTime()
    }));
  }catch(e){
    showToast('加载失败：' + (e.message || '网络问题'));
    entries = [];
  }
  isLoading = false;
  render();
}

async function insertEntry(entryData){
  const code = currentRoomCode();
  const { data, error } = await sb.from('entries')
    .insert({ room_code: code, author: config.nickname, data: entryData })
    .select().single();
  if(error) throw error;
  return { ...entryData, id: data.id, author: data.author, createdAt: new Date(data.created_at).getTime() };
}

async function updateEntryCloud(id, entryData){
  const { data, error } = await sb.from('entries')
    .update({ data: entryData })
    .eq('id', id).select().single();
  if(error) throw error;
  return { ...entryData, id: data.id, author: data.author, createdAt: new Date(data.created_at).getTime() };
}

async function deleteEntryCloud(id){
  const { error } = await sb.from('entries').delete().eq('id', id);
  if(error) throw error;
}

function canEdit(e){
  return activeRoom === 'personal' || e.author === config.nickname;
}

/* ---------- compress photo ---------- */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 480;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- stats / tabs / tags ---------- */
function renderStats(){
  const count = entries.length;
  const avg = count ? (entries.reduce((s,e)=>s+e.score,0)/count).toFixed(1) : '–';
  const now = new Date();
  const monthCount = entries.filter(e=>{
    const d = new Date(e.dateTried || e.createdAt);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).length;
  statStrip.innerHTML = `
    <div class="stat"><span class="num">${count}</span><span class="lbl">已记录款数</span></div>
    <div class="stat"><span class="num">${avg}</span><span class="lbl">平均评分</span></div>
    <div class="stat"><span class="num">${monthCount}</span><span class="lbl">本月新增</span></div>
  `;
}

function renderTabs(){
  tabsRow.innerHTML = `
    <button class="tab-btn ${activeRoom==='personal'?'active':''}" data-room="personal">我的私人测评</button>
    <button class="tab-btn ${activeRoom==='shared'?'active':''}" data-room="shared">朋友共享测评</button>
  `;
  tabsRow.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const room = btn.dataset.room;
      if(room === activeRoom) return;
      activeRoom = room;
      activeTag = null;
      renderTabs();
      await loadEntries();
    });
  });
}

function allTags(){
  const set = new Set();
  entries.forEach(e => (e.tags||[]).forEach(t => set.add(t)));
  return Array.from(set);
}

function renderTagRow(){
  const tags = allTags();
  if(!tags.length){ tagRow.innerHTML=''; return; }
  tagRow.innerHTML = tags.map(t => `<div class="tag-chip ${t===activeTag?'active':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join('');
  tagRow.querySelectorAll('.tag-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const t = chip.dataset.tag;
      activeTag = (activeTag === t) ? null : t;
      render();
    });
  });
}

/* ---------- render grid ---------- */
function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = entries.filter(e=>{
    if(activeTag && !(e.tags||[]).includes(activeTag)) return false;
    if(!q) return true;
    return [e.name, e.brand, e.flavor].join(' ').toLowerCase().includes(q);
  });
  const sortVal = document.getElementById('sortSelect').value;
  list.sort((a,b)=>{
    switch(sortVal){
      case 'score_desc': return b.score - a.score;
      case 'score_asc': return a.score - b.score;
      case 'price_asc': return (a.price||0) - (b.price||0);
      case 'price_desc': return (b.price||0) - (a.price||0);
      case 'name_asc': return (a.name||'').localeCompare(b.name||'');
      default: return (b.createdAt||0) - (a.createdAt||0);
    }
  });
  return list;
}

function render(){
  renderStats();
  renderTagRow();

  if(activeRoom === 'shared' && !config.groupCode){
    grid.innerHTML = `<div class="cta-box">
      ${emptyCloudSVG}
      <h3>还没加入共享群组</h3>
      <p>去设置里输入朋友给你的群组码，就能看到大家共享的测评了</p>
      <button class="btn-primary" id="ctaSettingsBtn" style="margin:0 auto;">打开设置</button>
    </div>`;
    document.getElementById('ctaSettingsBtn').addEventListener('click', openSettingsPanel);
    return;
  }

  if(isLoading){
    grid.innerHTML = `<div class="loading-state">加载中…</div>`;
    return;
  }

  const list = getFiltered();
  if(!entries.length){
    grid.innerHTML = `<div class="empty">
      ${emptyCloudSVG}
      <h3>还没有记录</h3>
      <p>试一支，写下来 — 从第一条测评开始</p>
      <button class="btn-primary" id="emptyAddBtn" style="margin:0 auto;">新建测评</button>
    </div>`;
    document.getElementById('emptyAddBtn').addEventListener('click', openAddPanel);
    return;
  }
  if(!list.length){
    grid.innerHTML = `<div class="empty">
      ${emptyCloudSVG}
      <h3>没有匹配的结果</h3>
      <p>换个关键词，或者清除筛选试试</p>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openDetailPanel(card.dataset.id));
  });
}

function cardHTML(e){
  const pct = Math.max(0, Math.min(100, (e.score/10)*100));
  const photo = e.photo ? `<img class="swatch" src="${e.photo}" style="object-fit:cover;">` : `<div class="swatch" style="background:${e.color||'#D9D9D9'}"></div>`;
  return `
  <div class="card" data-id="${e.id}">
    ${wispSVG(1)}
    ${e.rebuy ? `<div class="rebuy-tag rebuy-${e.rebuy}">${e.rebuy==='会'?'会回购':e.rebuy==='还行'?'还行':'不回购'}</div>` : ''}
    <div class="swatch-row">
      ${photo}
      <div>
        <div class="card-name">${escapeHtml(e.name||'未命名')}</div>
        <div class="card-brand">${escapeHtml(e.brand||'')}</div>
        ${activeRoom==='shared' ? `<div class="author-tag">@ ${escapeHtml(e.author||'匿名')}</div>` : ''}
      </div>
    </div>
    ${(e.tags&&e.tags.length) ? `<div class="chips">${e.tags.slice(0,4).map(t=>`<div class="chip">${escapeHtml(t)}</div>`).join('')}</div>` : ''}
    <div class="meta-row">
      <span>${e.price ? '¥'+e.price : '未填价格'}</span>
      <span>${e.puffs ? e.puffs+' puffs' : ''}</span>
    </div>
    <div class="meter-wrap">
      <div class="meter-score">${e.score.toFixed(1)}</div>
      <div class="meter-track">
        <div class="meter-fill" style="width:${pct}%">${meterWispSVG}</div>
      </div>
    </div>
  </div>`;
}

/* ---------- detail panel ---------- */
function openDetailPanel(id){
  const e = entries.find(x=>String(x.id)===String(id));
  if(!e) return;
  const editable = canEdit(e);
  const subRow = (label, val) => `
    <div class="sub-score-line">
      <span class="sub-label">${label}</span>
      <div class="dots-row">${[1,2,3,4,5].map(i=>`<div class="dot-btn ${i<=val?'filled':''}" style="cursor:default;width:14px;height:14px;"></div>`).join('')}</div>
    </div>`;
  panel.innerHTML = `
    <div class="panel-head">
      <h2>${escapeHtml(e.name||'未命名')}</h2>
      <div class="close-btn" id="closePanel">✕</div>
    </div>
    ${activeRoom==='shared' ? `<div class="author-tag" style="margin-bottom:14px;">@ ${escapeHtml(e.author||'匿名')} 添加</div>` : ''}
    ${e.photo ? `<img class="detail-photo" src="${e.photo}">` : ''}
    <div class="detail-score-block">
      <div class="meter-score" style="font-size:30px;">${e.score.toFixed(1)}</div>
      <div class="meter-track" style="flex:1;">
        <div class="meter-fill" style="width:${(e.score/10)*100}%">${meterWispSVG}</div>
      </div>
    </div>
    <div class="detail-sub-scores">
      ${subRow('甜度 SWEETNESS', e.subSweet||0)}
      ${subRow('冰感 ICE', e.subIce||0)}
      ${subRow('烟雾量 VAPOR', e.subVapor||0)}
      ${subRow('顺滑度 SMOOTHNESS', e.subSmooth||0)}
      ${subRow('击喉感 THROAT HIT', e.subThroat||0)}
    </div>
    <div class="detail-meta-grid">
      <div><span>品牌</span>${escapeHtml(e.brand||'—')}</div>
      <div><span>口味</span>${escapeHtml(e.flavor||'—')}</div>
      <div><span>价格</span>${e.price?('¥'+e.price):'—'}</div>
      <div><span>额定 Puffs</span>${e.puffs||'—'}</div>
      <div><span>入手日期</span>${e.dateTried||'—'}</div>
      <div><span>回购意愿</span>${e.rebuy||'—'}</div>
    </div>
    ${(e.tags&&e.tags.length) ? `<div class="chips" style="margin-bottom:16px;">${e.tags.map(t=>`<div class="chip">${escapeHtml(t)}</div>`).join('')}</div>` : ''}
    ${e.notes ? `<div class="detail-notes">${escapeHtml(e.notes)}</div>` : ''}
    ${!editable ? `<div class="readonly-banner">这条是 @${escapeHtml(e.author||'匿名')} 添加的，只有本人能编辑或删除</div>` : ''}
    <div class="panel-actions">
      ${editable ? `<button class="btn-danger" id="deleteBtn">删除这条记录</button>` : `<div></div>`}
      ${editable ? `<button class="btn-save" id="editBtn">编辑</button>` : `<div></div>`}
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('closePanel').addEventListener('click', closePanel);
  if(editable){
    document.getElementById('deleteBtn').addEventListener('click', ()=> deleteEntry(e.id));
    document.getElementById('editBtn').addEventListener('click', ()=> openEditPanel(e.id));
  }
}

function closePanel(){
  overlay.classList.remove('open');
  editingId = null;
  pendingPhoto = null;
}

async function deleteEntry(id){
  if(!confirm('确定要删除这条测评记录吗？此操作无法撤销。')) return;
  try{
    await deleteEntryCloud(id);
    entries = entries.filter(e=>String(e.id)!==String(id));
    closePanel();
    render();
    showToast('已删除');
  }catch(e){
    showToast('删除失败：' + (e.message || '网络问题'));
  }
}

/* ---------- add / edit form ---------- */
function openAddPanel(){
  if(activeRoom === 'shared' && !config.groupCode){
    showToast('请先在设置里加入一个群组码');
    return;
  }
  editingId = null;
  pendingPhoto = null;
  renderForm({
    id:null, name:'', brand:'', flavor:'', tagsStr:'', price:'', puffs:'',
    dateTried: new Date().toISOString().slice(0,10), color: SWATCHES[0], photo:null,
    score:7, subSweet:3, subIce:3, subVapor:3, subSmooth:3, subThroat:3, rebuy:'还行', notes:''
  }, '新建测评');
}
function openEditPanel(id){
  const e = entries.find(x=>String(x.id)===String(id));
  if(!e || !canEdit(e)) return;
  editingId = id;
  pendingPhoto = e.photo || null;
  renderForm({...e, tagsStr:(e.tags||[]).join(', ')}, '编辑测评');
}

function renderForm(data, title){
  panel.innerHTML = `
    <div class="panel-head">
      <h2>${title}</h2>
      <div class="close-btn" id="closePanel">✕</div>
    </div>
    <div class="field">
      <label>烟液 / 卡片颜色</label>
      <div class="color-row" id="colorRow">
        ${SWATCHES.map(c=>`<div class="color-dot ${c===data.color?'selected':''}" data-color="${c}" style="background:${c}"></div>`).join('')}
        <div class="color-dot custom-wrap"><input type="color" id="customColor" value="${data.color}"></div>
      </div>
    </div>
    <div class="field">
      <label>照片（可选，自动压缩）</label>
      <div class="photo-field">
        <img class="photo-preview" id="photoPreview" src="${data.photo || ''}" style="${data.photo?'':'display:none;'}">
        <button type="button" class="photo-btn" id="photoBtn">选择照片</button>
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
        <button type="button" class="photo-remove" id="photoRemoveBtn" style="${data.photo?'':'display:none;'}">移除</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>名称 / 型号</label><input type="text" id="f_name" value="${escapeHtml(data.name)}" placeholder="例如：XX 西瓜冰系列"></div>
      <div class="field"><label>品牌</label><input type="text" id="f_brand" value="${escapeHtml(data.brand)}" placeholder="品牌名"></div>
    </div>
    <div class="field"><label>口味描述</label><input type="text" id="f_flavor" value="${escapeHtml(data.flavor)}" placeholder="例如：冰感强烈，西瓜味偏甜"></div>
    <div class="field"><label>标签（逗号分隔）</label><input type="text" id="f_tags" value="${escapeHtml(data.tagsStr)}" placeholder="水果, 冰感, 一次性"></div>
    <div class="field-row">
      <div class="field"><label>价格（¥）</label><input type="number" id="f_price" value="${data.price||''}" placeholder="0"></div>
      <div class="field"><label>额定 Puffs</label><input type="number" id="f_puffs" value="${data.puffs||''}" placeholder="例如：600"></div>
    </div>
    <div class="field"><label>入手日期</label><input type="date" id="f_date" value="${data.dateTried||''}"></div>

    <div class="field">
      <label>综合评分</label>
      <div class="range-row">
        <input type="range" id="f_score" min="0" max="10" step="0.5" value="${data.score}">
        <div class="range-score" id="scoreDisplay">${Number(data.score).toFixed(1)}</div>
      </div>
    </div>

    <div class="field"><label>甜度</label><div class="dots-row" id="dots_sweet"></div></div>
    <div class="field"><label>冰感</label><div class="dots-row" id="dots_ice"></div></div>
    <div class="field"><label>烟雾量</label><div class="dots-row" id="dots_vapor"></div></div>
    <div class="field"><label>顺滑度</label><div class="dots-row" id="dots_smooth"></div></div>
    <div class="field"><label>击喉感</label><div class="dots-row" id="dots_throat"></div></div>

    <div class="field">
      <label>回购意愿</label>
      <div class="segmented" id="rebuySeg">
        ${['会','还行','不会'].map(v=>`<button type="button" data-val="${v}" class="${data.rebuy===v?'active':''}">${v}</button>`).join('')}
      </div>
    </div>

    <div class="field"><label>测评笔记</label><textarea id="f_notes" placeholder="写下口感、回甘、性价比之类的细节...">${escapeHtml(data.notes)}</textarea></div>

    <div class="panel-actions">
      <div></div>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
  `;
  overlay.classList.add('open');

  document.getElementById('closePanel').addEventListener('click', closePanel);

  let selectedColor = data.color;
  document.querySelectorAll('#colorRow .color-dot[data-color]').forEach(dot=>{
    dot.addEventListener('click', ()=>{
      selectedColor = dot.dataset.color;
      document.querySelectorAll('#colorRow .color-dot').forEach(d=>d.classList.remove('selected'));
      dot.classList.add('selected');
      document.getElementById('customColor').value = selectedColor;
    });
  });
  document.getElementById('customColor').addEventListener('input', e=>{
    selectedColor = e.target.value;
    document.querySelectorAll('#colorRow .color-dot[data-color]').forEach(d=>d.classList.remove('selected'));
  });

  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  const photoRemoveBtn = document.getElementById('photoRemoveBtn');
  photoBtn.addEventListener('click', ()=> photoInput.click());
  photoInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImage(file);
      pendingPhoto = dataUrl;
      photoPreview.src = dataUrl;
      photoPreview.style.display = 'block';
      photoRemoveBtn.style.display = 'inline';
    }catch(err){
      showToast('图片处理失败，请换一张试试');
    }
  });
  photoRemoveBtn.addEventListener('click', ()=>{
    pendingPhoto = null;
    photoPreview.style.display = 'none';
    photoRemoveBtn.style.display = 'none';
  });

  function buildDots(containerId, val, onChange){
    const c = document.getElementById(containerId);
    let current = val;
    function paint(){
      c.innerHTML = [1,2,3,4,5].map(i=>`<div class="dot-btn ${i<=current?'filled':''}" data-i="${i}"></div>`).join('');
      c.querySelectorAll('.dot-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          current = Number(btn.dataset.i);
          paint();
          onChange(current);
        });
      });
    }
    paint();
    return { get:()=>current };
  }
  const sweetDots = buildDots('dots_sweet', data.subSweet, ()=>{});
  const iceDots = buildDots('dots_ice', data.subIce, ()=>{});
  const vaporDots = buildDots('dots_vapor', data.subVapor, ()=>{});
  const smoothDots = buildDots('dots_smooth', data.subSmooth, ()=>{});
  const throatDots = buildDots('dots_throat', data.subThroat, ()=>{});

  const scoreSlider = document.getElementById('f_score');
  const scoreDisplay = document.getElementById('scoreDisplay');
  scoreSlider.addEventListener('input', ()=> scoreDisplay.textContent = Number(scoreSlider.value).toFixed(1));

  let rebuyVal = data.rebuy;
  document.querySelectorAll('#rebuySeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      rebuyVal = btn.dataset.val;
      document.querySelectorAll('#rebuySeg button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ showToast('请填写名称'); return; }
    const tags = document.getElementById('f_tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const entryData = {
      name,
      brand: document.getElementById('f_brand').value.trim(),
      flavor: document.getElementById('f_flavor').value.trim(),
      tags,
      price: Number(document.getElementById('f_price').value) || 0,
      puffs: Number(document.getElementById('f_puffs').value) || 0,
      dateTried: document.getElementById('f_date').value,
      color: selectedColor,
      photo: pendingPhoto,
      score: Number(scoreSlider.value),
      subSweet: sweetDots.get(),
      subIce: iceDots.get(),
      subVapor: vaporDots.get(),
      subSmooth: smoothDots.get(),
      subThroat: throatDots.get(),
      rebuy: rebuyVal,
      notes: document.getElementById('f_notes').value.trim()
    };
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';
    try{
      if(editingId){
        const updated = await updateEntryCloud(editingId, entryData);
        entries = entries.map(e => String(e.id)===String(editingId) ? updated : e);
      }else{
        const created = await insertEntry(entryData);
        entries.unshift(created);
      }
      closePanel();
      render();
      showToast(editingId ? '已保存修改' : '已添加新记录');
    }catch(err){
      showToast('保存失败：' + (err.message || '网络问题'));
      saveBtn.disabled = false;
      saveBtn.textContent = '保存';
    }
  });
}

      <div class="code-row">
        <input type="text" id="s_personal" value="${escapeHtml(config.personalCode)}" placeholder="自动生成">
        <button type="button" class="copy-btn" id="copyPersonal">复制</button>
      </div>
      <div class="hint-text">只属于你自己——换设备时在新设备上填入同一个码，就能看到这份私人记录。别分享给别人。</div>
    </div>
    <div class="field">
      <label>朋友群组码（可选）</label>
      <div class="code-row">
        <input type="text" id="s_group" value="${escapeHtml(config.groupCode||'')}" placeholder="留空 = 不加入共享">
        <button type="button" class="copy-btn" id="copyGroup">复制</button>
      </div>
      <div class="hint-text">和朋友约定同一个码，大家就能看到同一份"朋友共享测评"。可以自己想一个，也可以填朋友给你的码。</div>
    </div>
    <div class="panel-actions">
      <div></div>
      <button class="btn-save" id="saveSettingsBtn">${isFirstRun ? '开始使用' : '保存'}</button>
    </div>
  `;
  overlay.classList.add('open');
  if(!isFirstRun){
    document.getElementById('closePanel').addEventListener('click', closePanel);
  }
  document.getElementById('copyPersonal').addEventListener('click', ()=> copyToClipboard(document.getElementById('s_personal').value));
  document.getElementById('copyGroup').addEventListener('click', ()=> copyToClipboard(document.getElementById('s_group').value));

  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    const nickname = document.getElementById('s_nickname').value.trim();
    const personal = document.getElementById('s_personal').value.trim();
    const group = document.getElementById('s_group').value.trim();
    if(!nickname){ showToast('请填写昵称'); return; }
    if(!personal){ showToast('私人同步码不能为空'); return; }
    config = { nickname, personalCode: personal, groupCode: group };
    saveConfig();
    closePanel();
    activeTag = null;
    await loadEntries();
    showToast('设置已保存');
  });
}
function openSettingsPanel(){ renderSettingsForm(false); }

/* ---------- events ---------- */
document.getElementById('addBtn').addEventListener('click', openAddPanel);
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('settingsBtn').addEventListener('click', openSettingsPanel);
overlay.addEventListener('click', (e)=>{
  if(e.target===overlay){
    const hasClose = panel.querySelector('.close-btn');
    if(hasClose) closePanel();
  }
});

/* ---------- init ---------- */
(async function init(){
  loadConfig();
  renderTabs();
  if(!config.nickname || !config.personalCode){
    if(!config.personalCode) config.personalCode = randomCode();
    renderSettingsForm(true);
    return;
  }
  await loadEntries();
})();
</script>
</body>
</html>
