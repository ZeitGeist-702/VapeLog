<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>仿生人会梦见电子烟吗</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="仿生人会梦见电子烟吗">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#EEF2F1;
  --paper:#FBF9F6;
  --paper-soft:#F4F1EC;
  --ink:#1B2422;
  --muted:#6B7572;
  --line:#DCE3E0;
  --ember:#FF6B35;
  --ember-deep:#E0501C;
  --amber:#D9A24B;
  --sage:#6E8C82;
  --sage-soft:#DCE6E2;
  --danger:#C24B3F;
  --input-bg:#fff;
  --radius:18px;
  --shadow: 0 1px 2px rgba(27,36,34,0.04), 0 8px 24px -8px rgba(27,36,34,0.10);
}

[data-theme="dark"]{
  --bg:#14181A;
  --paper:#1E2422;
  --paper-soft:#262E2B;
  --ink:#ECF1EE;
  --muted:#909C98;
  --line:#323C39;
  --ember:#FF7A47;
  --ember-deep:#FF6B35;
  --amber:#E0B25E;
  --sage:#86AA9F;
  --sage-soft:#27352F;
  --danger:#E0685A;
  --input-bg:#222A27;
  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -8px rgba(0,0,0,0.45);
}
[data-theme="dark"] body{background:var(--bg);}
[data-theme="dark"] .overlay{background:rgba(0,0,0,0.55);}
[data-theme="dark"] .panel{box-shadow:0 24px 60px -10px rgba(0,0,0,0.55);}
[data-theme="dark"] .badge-card.unlocked .badge-title,
[data-theme="dark"] .badge-card.unlocked .badge-desc,
[data-theme="dark"] .badge-card.unlocked .badge-progress{ color:#2A2018; }
[data-theme="dark"] .tab-btn.active{ color:#1B2422; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

/* ---- header ---- */
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.icon-btn{
  background:var(--paper);border:1px solid var(--line);
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);flex:none;
}
.icon-btn:hover{border-color:var(--sage);color:var(--sage);}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.14em;
  color:var(--sage);
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.eyebrow::before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:var(--ember);
  box-shadow:0 0 0 3px rgba(255,107,53,0.18);
}
h1.title{
  font-family:'Space Grotesk',sans-serif;
  font-size:32px;
  font-weight:700;
  margin:0 0 18px;
  letter-spacing:-0.01em;
}

.stat-strip{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  padding:16px 20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat .num{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;}
.stat .lbl{font-size:11.5px;color:var(--muted);}

/* ---- tabs ---- */
.tabs-row{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
  padding:9px 16px;border-radius:11px;
  background:var(--paper);border:1px solid var(--line);
  color:var(--muted);cursor:pointer;
}
.tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---- toolbar ---- */
.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
  align-items:center;
}
.search-box{
  flex:1 1 220px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:11px 14px 11px 38px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--paper);
  font-family:'Inter',sans-serif;
  font-size:14px;
  color:var(--ink);
  outline:none;
}
.search-box input:focus{border-color:var(--sage);}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}

select.sort-select{
  padding:11px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--paper);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  color:var(--ink);
  outline:none;
  cursor:pointer;
}

.btn-primary{
  background:var(--ember);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:background .15s ease, transform .1s ease;
  white-space:nowrap;
}
.btn-primary:hover{background:var(--ember-deep);}
.btn-primary:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.6;cursor:default;}

/* ---- tag filter chips ---- */
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.tag-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  padding:6px 11px;
  border-radius:999px;
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--muted);
  cursor:pointer;
  user-select:none;
}
.tag-chip.active{
  background:var(--sage);
  color:#fff;
  border-color:var(--sage);
}

.tag-picker{display:flex;flex-wrap:wrap;gap:6px;}
.tag-picker .tag-chip{margin:0;}

.word-cloud{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:center;padding:8px 4px;}
.word-cloud span{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);line-height:1.3;}

.rarity-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rarity-bar-name{font-size:12px;font-family:'IBM Plex Mono',monospace;width:76px;flex:none;color:var(--muted);}
.rarity-bar-track{flex:1;height:8px;border-radius:999px;background:var(--paper-soft);overflow:hidden;}
.rarity-bar-fill{height:100%;border-radius:999px;}
.rarity-bar-count{font-size:12px;font-family:'IBM Plex Mono',monospace;width:24px;flex:none;text-align:right;color:var(--ink);}

.export-card{
  position:fixed;left:-9999px;top:0;
  width:340px;padding:28px 24px;
  background:var(--paper);border-radius:20px;
  font-family:'Inter',sans-serif;
  text-align:center;
}
.export-ident{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:6px;}
.export-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:var(--ink);}
.export-brand{font-size:13px;color:var(--muted);margin-bottom:14px;}
.export-fp{display:flex;justify-content:center;margin-bottom:14px;}
.export-score{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);margin-bottom:10px;}
.export-flavor{font-size:12.5px;color:var(--ink);margin-bottom:12px;line-height:1.5;}
.export-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
.export-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--paper-soft);color:var(--muted);}
.export-footer{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.05em;margin-top:8px;}

.export-subscores{margin-bottom:12px;text-align:left;}
.export-subrow{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--ink);}
.export-subrow span:first-child{color:var(--muted);}
.export-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;text-align:left;margin-bottom:12px;font-size:12px;}
.export-meta-grid div span{display:block;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;margin-bottom:2px;}
.export-notes{font-size:12px;color:var(--ink);text-align:left;line-height:1.5;margin-bottom:12px;padding:8px 10px;background:var(--paper-soft);border-radius:8px;}

/* ---- grid ---- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:16px;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(27,36,34,0.06), 0 16px 32px -10px rgba(27,36,34,0.14);}

.card .wisp{
  position:absolute;
  top:-18px;right:-18px;
  width:90px;height:90px;
  opacity:0.55;
  pointer-events:none;
}

.swatch-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.swatch{
  width:30px;height:30px;border-radius:9px;flex:none;
  border:1px solid rgba(0,0,0,0.06);
}
.card-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16.5px;line-height:1.25;}
.card-brand{font-size:12.5px;color:var(--muted);margin-top:1px;}
.author-tag{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:var(--sage);background:var(--sage-soft);
  padding:2px 8px;border-radius:999px;
  display:inline-block;margin-top:6px;
}
.purchase-tag{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  color:#9C7A26;background:#FBF1DE;
  padding:2px 8px;border-radius:999px;
  display:inline-block;margin-top:6px;margin-left:6px;
}

.like-btn{
  display:inline-flex; align-items:center; gap:10px;
  background:none; border:none; cursor:pointer;
  padding:6px 4px; position:relative;
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;
  color:var(--muted);
}
.like-btn svg{ width:17px; height:46px; flex:none; overflow:visible; }
.pod-cartridge{ opacity:0; transform:translateY(-4px); transition:opacity .15s ease, transform .25s cubic-bezier(.2,.8,.3,1.3); }
.like-btn.liked .pod-cartridge{ opacity:1; transform:translateY(0); }
[data-theme="dark"] .like-btn .pod-cartridge{ fill:rgba(220,225,228,0.16) !important; stroke:rgba(220,225,228,0.45) !important; }
.indicator{ fill:#C9D1CD; transition:fill .2s ease, filter .2s ease; }
.like-btn.liked .indicator{ fill:#EAF6FF; filter:drop-shadow(0 0 1.5px #BFE3FF) drop-shadow(0 0 3px #8FC7F0); }
.vapor-wisp{
  fill:none;
  stroke:rgba(170,180,178,0.85);
  stroke-width:0.55;
  stroke-linecap:round;
  opacity:0;
  transform-box: fill-box;
  transform-origin: 0 0;
}
.like-btn.liked.smoking .vapor-wisp.w1{ animation: wisp-drift-a 1.6s ease-out; }
.like-btn.liked.smoking .vapor-wisp.w2{ animation: wisp-drift-b 1.7s ease-out; animation-delay:.18s; }
.like-btn.liked.smoking .vapor-wisp.w3{ animation: wisp-drift-c 1.8s ease-out; animation-delay:.38s; }
@keyframes wisp-drift-a{
  0%{ opacity:0; transform:translate(0,0) scale(0.5) rotate(0deg); }
  12%{ opacity:0.7; }
  55%{ opacity:0.4; }
  100%{ opacity:0; transform:translate(-1.2px,-10px) scale(1.5) rotate(-8deg); }
}
@keyframes wisp-drift-b{
  0%{ opacity:0; transform:translate(0,0) scale(0.5) rotate(0deg); }
  12%{ opacity:0.65; }
  55%{ opacity:0.35; }
  100%{ opacity:0; transform:translate(1.5px,-11.5px) scale(1.6) rotate(10deg); }
}
@keyframes wisp-drift-c{
  0%{ opacity:0; transform:translate(0,0) scale(0.5) rotate(0deg); }
  12%{ opacity:0.6; }
  55%{ opacity:0.3; }
  100%{ opacity:0; transform:translate(0.4px,-13px) scale(1.8) rotate(3deg); }
}

.unbox-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center;z-index:200;
  opacity:0;transition:opacity .2s ease;
}
.unbox-overlay.show{opacity:1;}
.unbox-card{
  background:var(--paper);border-radius:16px;
  padding:28px 32px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
}
.unbox-card svg{width:34px;height:92px;overflow:visible;}
.unbox-glow{display:inline-block;}
.unbox-card .pod-cartridge{opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .35s cubic-bezier(.2,.8,.3,1.3);}
.unbox-card.show .pod-cartridge{opacity:1;transform:translateY(0);}
.unbox-card .indicator{fill:#C9D1CD;transition:fill .25s ease,filter .25s ease;}
.unbox-card.show .indicator{fill:var(--glow-color,#EAF6FF);filter:drop-shadow(0 0 2px var(--glow-color,#BFE3FF)) drop-shadow(0 0 4px var(--glow-color,#8FC7F0));}
.unbox-card .vapor-wisp{fill:none;stroke:rgba(170,180,178,0.85);stroke-width:0.55;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:0 0;}
.unbox-card.smoking .vapor-wisp.w1{animation:wisp-drift-a 1.6s ease-out;}
.unbox-card.smoking .vapor-wisp.w2{animation:wisp-drift-b 1.7s ease-out;animation-delay:.18s;}
.unbox-card.smoking .vapor-wisp.w3{animation:wisp-drift-c 1.8s ease-out;animation-delay:.38s;}
.unbox-text{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;margin-top:16px;letter-spacing:0.03em;}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.chip{
  font-size:11px;
  font-family:'IBM Plex Mono',monospace;
  background:var(--sage-soft);
  color:var(--sage);
  padding:3px 9px;
  border-radius:999px;
}

.meta-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin:10px 0 12px;
  font-family:'IBM Plex Mono',monospace;
}

/* vapor meter (signature rating element) */
.meter-wrap{display:flex;align-items:center;gap:10px;}
.meter-score{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:20px;
  flex:none;
  min-width:38px;
}
.meter-track{
  flex:1;
  height:9px;
  border-radius:999px;
  background:var(--paper-soft);
  border:1px solid var(--line);
  position:relative;
  overflow:visible;
}
.meter-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg, var(--amber), var(--ember));
  position:relative;
}
.meter-wisp{
  position:absolute;
  right:-9px;top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;
  opacity:0.9;
}

.rebuy-tag{
  position:absolute;
  top:14px;right:14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  padding:3px 8px;
  border-radius:999px;
  font-weight:600;
  letter-spacing:0.02em;
}
.rebuy-会{background:#E4F1EC;color:#3F7A63;}
.rebuy-还行{background:#FBF1DE;color:#9C7A26;}
.rebuy-不会{background:#F7E6E3;color:var(--danger);}

/* ---- empty / cta state ---- */
.empty, .cta-box{
  text-align:center;
  padding:60px 20px;
  background:var(--paper);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  grid-column:1/-1;
}
.empty svg, .cta-box svg{width:64px;height:64px;margin-bottom:14px;opacity:0.6;}
.empty h3, .cta-box h3{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;font-size:18px;}
.empty p, .cta-box p{color:var(--muted);font-size:14px;margin:0 0 18px;}

.loading-state{
  grid-column:1/-1;text-align:center;padding:60px 20px;
  color:var(--muted);font-size:14px;
}

/* ---- overlay / panel ---- */
.overlay{
  position:fixed;inset:0;
  background:rgba(27,36,34,0.32);
  backdrop-filter:blur(2px);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:32px 16px;
  z-index:50;
  overflow-y:auto;
}
.overlay.open{display:flex;}
.panel{
  background:var(--paper);
  border-radius:22px;
  max-width:560px;
  width:100%;
  padding:28px 26px 26px;
  box-shadow:0 24px 60px -10px rgba(0,0,0,0.25);
  margin-bottom:32px;
}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px;}
.ident-code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.04em;margin-top:2px;}
.panel-head h2{font-family:'Space Grotesk',sans-serif;font-size:21px;margin:0;}
.close-btn{
  background:var(--paper-soft);
  border:none;width:32px;height:32px;border-radius:50%;
  cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);
}
.close-btn:hover{background:var(--sage-soft);color:var(--sage);}

.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:6px;
  font-family:'IBM Plex Mono',monospace;
  text-transform:uppercase;
  letter-spacing:0.03em;
}
.field input[type=text], .field input[type=number], .field input[type=date], .field textarea, .field select{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--input-bg);
  font-family:'Inter',sans-serif;
  font-size:14px;
  color:var(--ink);
  outline:none;
}
.field input:focus, .field textarea:focus{border-color:var(--sage);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}

.code-row{display:flex;gap:8px;align-items:center;}
.code-row input{flex:1;}
.copy-btn{
  background:var(--paper-soft);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);
  flex:none;font-family:'Inter',sans-serif;
}
.copy-btn:hover{border-color:var(--sage);}
.hint-text{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}

.readonly-banner{
  font-size:12.5px;color:var(--muted);
  background:var(--paper-soft);border-radius:10px;
  padding:9px 12px;margin-bottom:14px;
  font-family:'IBM Plex Mono',monospace;
}

.badge-list{
  display:flex;flex-direction:column;gap:10px;margin-bottom:8px;
}
.badge-card{
  border-radius:14px;padding:14px 16px;
  border:1px solid var(--line);
  text-align:left;
}
.badge-card.unlocked{background:#FBF1DE;border-color:var(--amber);}
.badge-card.locked{background:var(--paper-soft);opacity:0.8;}
.badge-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;margin-bottom:5px;line-height:1.4;}
.badge-redacted{
  height:17px;width:72%;
  background:#1B2422;
  border-radius:3px;
  margin-bottom:8px;
}
.badge-desc{font-size:11.5px;color:var(--muted);margin-bottom:6px;line-height:1.4;}
.badge-progress{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sage);}
.badge-card.unlocked .badge-progress{color:#9C7A26;font-weight:700;}

/* ---- achievement unlock modal (cyberpunk glass, echoes recap card) ---- */
.achv-modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(8,6,10,0);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  transition:background .25s ease;
}
.achv-modal-overlay.show{background:rgba(8,6,10,0.6);backdrop-filter:blur(2px);}
.achv-modal-card{
  position:relative;
  width:100%;max-width:320px;
  background:
    radial-gradient(circle at 20% 15%, rgba(75,20,55,0.32), transparent 55%),
    radial-gradient(circle at 85% 85%, rgba(20,55,42,0.32), transparent 55%),
    #0C0810;
  color:#F0EAEE;
  border:1px solid rgba(255,255,255,0.12);

/* ---------- vapor fingerprint (5-axis mist radar) ---------- */
function fingerprintSVG(e, size, showLabels){
  const vals = [e.subSweet||0, e.subIce||0, e.subVapor||0, e.subSmooth||0, e.subThroat||0];
  const labels = ['口味','冰感','烟雾量','顺滑度','击喉感'];
  const cx = size/2, cy = size/2, maxR = size*0.40;
  const ANGLES = [-90,-18,54,126,198].map(d=>d*Math.PI/180);
  const pt = (r,i) => `${(cx+r*Math.cos(ANGLES[i])).toFixed(1)},${(cy+r*Math.sin(ANGLES[i])).toFixed(1)}`;
  const ring = r => ANGLES.map((_,i)=>pt(r,i)).join(' ');
  const shapePts = vals.map((v,i)=> pt(maxR*(Math.max(0,Math.min(5,v))/5), i)).join(' ');
  const labelsSVG = showLabels ? labels.map((l,i)=>{
    const lr = maxR + size*0.15;
    const x = (cx+lr*Math.cos(ANGLES[i])).toFixed(1);
    const y = (cy+lr*Math.sin(ANGLES[i])).toFixed(1);
    const anchor = Math.cos(ANGLES[i])>0.15?'start':Math.cos(ANGLES[i])<-0.15?'end':'middle';
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" fill="var(--muted)">${l}</text>`;
  }).join('') : '';
  return `
  <svg class="vapor-fingerprint" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="风味指纹图">
    <polygon points="${ring(maxR)}" fill="none" stroke="var(--line)" stroke-width="1"/>
    <polygon points="${ring(maxR*0.55)}" fill="none" stroke="var(--line)" stroke-width="0.6"/>
    <polygon points="${shapePts}" fill="var(--muted)" opacity="0.10" transform-origin="${cx}px ${cy}px" transform="scale(1.12)"/>
    <polygon points="${shapePts}" fill="var(--muted)" opacity="0.14" transform-origin="${cx}px ${cy}px" transform="scale(1.06)"/>
    <polygon points="${shapePts}" fill="var(--ink)" opacity="0.20" stroke="var(--muted)" stroke-width="${size>150?1.6:1.2}"/>
    ${labelsSVG}
  </svg>`;
}

/* ---------- rarity tier (score-based card border) ---------- */
function rarityTier(score){
  const s = Number(score)||0;
  if(s>=10) return {name:'电子涅槃', color:null, rainbow:true};
  if(s>=8.5) return {name:'灵魂共振', color:'#BA7517'};
  if(s>=7) return {name:'小型觉醒', color:'#9333EA'};
  if(s>=5) return {name:'凡夫俗子', color:'#378ADD'};
  return {name:'戒断反射', color:'#639922'};
}
function rarityBorderStyle(score){
  const tier = rarityTier(score);
  if(tier.rainbow){
    return `border:1.5px solid transparent;background-image:linear-gradient(var(--paper),var(--paper)),linear-gradient(90deg,#D4537E,#9333EA,#378ADD,#639922,#BA7517);background-origin:border-box;background-clip:padding-box,border-box;`;
  }
  return `border:1.5px solid ${tier.color};`;
}

/* ---------- purchase records (per-unit bought/finished tracking) ---------- */
function getPurchases(e){
  if(Array.isArray(e.purchases)) return e.purchases;
  const count = e.purchaseCount || 1;
  const purchases = [];
  for(let i=0;i<count;i++){
    purchases.push({ id: 'p'+i, boughtDate: e.dateTried || '', finishedDate: null });
  }
  return purchases;
}

/* ---------- graveyard (finished purchases, eulogy generated) ---------- */
function getGraveyardEntries(entriesList){
  const list = [];
  entriesList.forEach(e=>{
    getPurchases(e).forEach(p=>{
      if(p.finishedDate){
        list.push({
          purchaseId: p.id, entryId: e.id, name: e.name||'未命名', brand: e.brand||'',
          score: Number(e.score)||0, boughtDate: p.boughtDate||'', finishedDate: p.finishedDate,
          epitaph: p.epitaph||''
        });
      }
    });
  });
  list.sort((a,b)=> new Date(b.finishedDate) - new Date(a.finishedDate));
  return list;
}

function eulogyText(item){
  const hasDays = item.boughtDate && item.finishedDate;
  const days = hasDays ? Math.max(0, Math.round((new Date(item.finishedDate)-new Date(item.boughtDate))/86400000)) : null;
  const templates = [];
  if(item.score >= 8.5){
    templates.push(`[灵魂共振] ${days!==null?`${days} 天里，`:''}它曾让某个深夜不那么难熬，直到最后一口散尽。`);
  }else if(item.score < 5){
    templates.push(`[古老的爬虫脑] 早该扔了对吧，可手指还是舍不得停下来。`);
  }else{
    templates.push(`[退役通知] 没成为传说，但成为了某几天的背景音。`);
  }
  templates.push(`[内陆帝国] 你知道自己迟早会再买同款的，这不是结束，是轮回。`);
  if(days!==null){
    templates.push(`[遗物档案] 从相遇到耗尽，一共 ${days} 天，喉咙记得每一天。`);
  }
  templates.push(`[戒断反射] 最后一口散尽的瞬间，手指还保持着按下的姿势。`);
  let hash = 0;
  for(const c of String(item.purchaseId)) hash = (hash*31 + c.charCodeAt(0)) | 0;
  const idx = Math.abs(hash) % templates.length;
  return templates[idx];
}

/* ---------- compress photo ---------- */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 480;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- render grid ---------- */
function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let list = entries.filter(e=>{
    if(activeTag && !(e.tags||[]).includes(activeTag)) return false;
    if(!q) return true;
    return [e.name, e.brand, e.flavor].join(' ').toLowerCase().includes(q);
  });
  const sortVal = document.getElementById('sortSelect').value;
  list.sort((a,b)=>{
    switch(sortVal){
      case 'score_desc': return b.score - a.score;
      case 'score_asc': return a.score - b.score;
      case 'price_asc': return (a.price||0) - (b.price||0);
      case 'price_desc': return (b.price||0) - (a.price||0);
      case 'name_asc': return (a.name||'').localeCompare(b.name||'');
      default: return (b.createdAt||0) - (a.createdAt||0);
    }
  });
  return list;
}

  renderStats();
  renderTagRow();

  if(activeRoom === 'shared' && !config.groupCode){
    grid.innerHTML = `<div class="cta-box">
      ${emptyCloudSVG}
      <h3>还没加入共享群组</h3>
      <p>去设置里输入朋友给你的群组码，就能看到大家共享的测评了</p>
      <button class="btn-primary" id="ctaSettingsBtn" style="margin:0 auto;">打开设置</button>
    </div>`;
    document.getElementById('ctaSettingsBtn').addEventListener('click', openSettingsPanel);
    return;
  }

  if(isLoading){
    grid.innerHTML = `<div class="loading-state">加载中…</div>`;
    return;
  }

  const list = getFiltered();
  if(!entries.length){
    grid.innerHTML = `<div class="empty">
      ${emptyCloudSVG}
      <h3>还没有记录</h3>
      <p>试一支，写下来 — 从第一条测评开始</p>
      <button class="btn-primary" id="emptyAddBtn" style="margin:0 auto;">新建测评</button>
    </div>`;
    document.getElementById('emptyAddBtn').addEventListener('click', openAddPanel);
    return;
  }
  if(!list.length){
    grid.innerHTML = `<div class="empty">
      ${emptyCloudSVG}
      <h3>没有匹配的结果</h3>
      <p>换个关键词，或者清除筛选试试</p>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openDetailPanel(card.dataset.id));
  });
}

function cardHTML(e){
  const pct = Math.max(0, Math.min(100, (e.score/10)*100));
  const photo = e.photo ? `<img class="swatch" src="${e.photo}" style="object-fit:cover;">` : `<div class="swatch" style="background:${e.color||'#D9D9D9'}"></div>`;
  return `
  <div class="card" data-id="${e.id}" style="${rarityBorderStyle(e.score)}">
    ${wispSVG(1)}
    ${e.rebuy ? `<div class="rebuy-tag rebuy-${e.rebuy}">${e.rebuy==='会'?'会回购':e.rebuy==='还行'?'还行':'不回购'}</div>` : ''}
    <div class="swatch-row">
      ${photo}
      <div>
        <div class="card-name">${escapeHtml(e.name||'未命名')}</div>
        <div class="card-brand">${escapeHtml(e.brand||'')}</div>
        ${activeRoom==='shared' ? `<div class="author-tag">@ ${escapeHtml(e.author||'匿名')}${e.authorTitle?` · ${escapeHtml(e.authorTitle)}`:''}</div>` : ''}
        ${(e.purchaseCount||1) > 1 ? `<div class="purchase-tag">购入 ${e.purchaseCount} 次</div>` : ''}
      </div>
      <div style="margin-left:auto;flex:none;">${fingerprintSVG(e, 44, false)}</div>
    </div>
    ${(e.tags&&e.tags.length) ? `<div class="chips">${e.tags.slice(0,4).map(t=>`<div class="chip">${escapeHtml(t)}</div>`).join('')}</div>` : ''}
    <div class="meta-row">
      <span>${e.price ? '¥'+e.price : '未填价格'}</span>
      <span>${e.puffs ? e.puffs+' puffs' : ''}</span>

    <div class="meter-wrap">
      <div class="meter-score">${e.score.toFixed(1)}</div>
      <div class="meter-track">
        <div class="meter-fill" style="width:${pct}%">${meterWispSVG}</div>
      </div>
    </div>
    ${activeRoom==='shared' ? likeButtonHTML(e) : ''}

}

function likeButtonHTML(e){
  const likes = e.likes || [];
  const liked = likes.includes(config.nickname);
  return `
    <button type="button" class="like-btn ${liked?'liked':''}" data-like-id="${e.id}" onclick="event.stopPropagation(); toggleLike('${e.id}')">
      ${pipeSVG}
      <span>${likes.length}</span>
    </button>`;
}

/* strips internal fields (id/author/createdAt) so an entry object can be safely
   resent as the jsonb "data" payload */
function entryToData(e){
  const { id, author, createdAt, ...rest } = e;
  return rest;
}

function spawnSmoke(btn){
  btn.classList.remove('smoking');
  void btn.offsetWidth; // force reflow so the animation can replay even if triggered again quickly
  btn.classList.add('smoking');
  setTimeout(()=> btn.classList.remove('smoking'), 2000);
}

async function toggleLike(id){
  const e = entries.find(x=>String(x.id)===String(id));
  if(!e || !config.nickname) return;
  const likes = e.likes || [];
  const hasLiked = likes.includes(config.nickname);
  const newLikes = hasLiked ? likes.filter(n=>n!==config.nickname) : [...likes, config.nickname];
  const entryData = { ...entryToData(e), likes: newLikes };

  const btn = document.querySelector(`[data-like-id="${id}"]`);
  if(btn){
    btn.classList.toggle('liked', !hasLiked);
    btn.querySelector('span').textContent = newLikes.length;
    if(!hasLiked) spawnSmoke(btn);
  }

  try{
    const updated = await updateEntryCloud(id, entryData);
    entries = entries.map(x => String(x.id)===String(id) ? updated : x);
  }catch(err){
    if(btn){
      btn.classList.toggle('liked', hasLiked);
      btn.querySelector('span').textContent = likes.length;
    }
    showToast('点赞失败：' + (err.message || '网络问题'));
  }
}

async function shareToGroup(e){
  if(!config.groupCode){ showToast('请先在设置里加入一个群组码'); return; }
  const entryData = { ...entryToData(e), authorTitle: config.equippedTitle || null };
  try{
    const { error } = await sb.from('entries').insert({ room_code: config.groupCode, author: config.nickname, data: entryData });
    if(error) throw error;
    showToast('已分享到朋友共享测评');
  }catch(err){
    showToast('分享失败：' + (err.message || '网络问题'));
  }
}

function closePanel(){
  overlay.classList.remove('open');
  editingId = null;
  pendingPhoto = null;
}

async function deleteEntry(id){
  if(!confirm('确定要删除这条测评记录吗？此操作无法撤销。')) return;
  try{
    await deleteEntryCloud(id);
    entries = entries.filter(e=>String(e.id)!==String(id));
    closePanel();
    render();
    showToast('已删除');
  }catch(e){
    showToast('删除失败：' + (e.message || '网络问题'));
  }
}

function filterByRange(es, range){
  if(range === 'all') return es;
  const now = new Date();
  return es.filter(e=>{
    const d = new Date(e.dateTried || e.createdAt);
    if(isNaN(d.getTime())) return false;
    if(range === 'year') return d.getFullYear() === now.getFullYear();
    if(range === 'quarter'){
      const curQ = Math.floor(now.getMonth()/3);
      const eq = Math.floor(d.getMonth()/3);
      return d.getFullYear()===now.getFullYear() && eq===curQ;
    }
    return true;
  });
}

function computeRecapStats(es){
  const count = es.length;
  const avg = count ? es.reduce((s,e)=>s+Number(e.score||0),0)/count : 0;
  let top = null;
  es.forEach(e=>{ if(!top || Number(e.score)>Number(top.score)) top = e; });
  const tagCounts = {};
  es.forEach(e=> (e.tags||[]).forEach(t=>{ tagCounts[t]=(tagCounts[t]||0)+1; }));
  let topTag = null, topTagCount = 0;
  Object.entries(tagCounts).forEach(([t,c])=>{ if(c>topTagCount){ topTag=t; topTagCount=c; } });
  const rebuyYes = es.filter(e=>e.rebuy==='会').length;
  return { count, avg, top, topTag, topTagCount, rebuyYes };
}

function generateQuip(stats){
  if(stats.count === 0) return '这段时间还没有记录，去试一支新口味，写下第一篇测评吧';
  const lines = [];
  if(stats.avg >= 8.5) lines.push('眼光毒辣，这阵子遇到的基本都是好货');
  else if(stats.avg <= 5) lines.push('这阵子踩雷不少，得擦亮眼了');
  else lines.push('整体平平稳稳，没什么大雷也没什么王炸');
  if(stats.count >= 15) lines.push('钱包已经为"科学测评"做出了不小的贡献');
  else if(stats.count <= 2) lines.push('这阵子手头比较收敛');
  return lines.join('，');
}

/* ---------- word cloud (tags + flavor text, lightweight bigram approach) ---------- */
const WORDCLOUD_STOPWORDS = new Set(['的','了','是','有点','非常','比较','一点','还是','就是','感觉','但是','然后','而且','这个','那个','一般','其实','特别','稍微','有些','很像','好像','就像','味道','没有','有种','一种','这种','那种']);
function extractWordCloudTerms(es){
  const freq = {};
  const addTerm = (term, weight) => {
    term = term.trim();
    if(!term) return;
    freq[term] = (freq[term]||0) + weight;
  };
  es.forEach(e=>{
    (e.tags||[]).forEach(t=> addTerm(t, 3));
    const flavor = (e.flavor||'').replace(/[，。、！？~～\s,.!?()（）]/g,'');
    for(let i=0;i<flavor.length-1;i++){
      const bigram = flavor.slice(i,i+2);
      if(WORDCLOUD_STOPWORDS.has(bigram)) continue;
      if(!/[\u4e00-\u9fa5]/.test(bigram)) continue;
      addTerm(bigram, 1);
    }
  });
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,30);
}
function wordCloudHTML(es){
  const terms = extractWordCloudTerms(es);
  if(!terms.length) return `<div class="hint-text">还没有足够的口味描述和标签。</div>`;
  const maxCount = terms[0][1];
  const minCount = terms[terms.length-1][1];
  const range = maxCount - minCount || 1;
  return `<div class="word-cloud">${terms.map(([word,count])=>{
    const t = (count - minCount) / range;
    const fontSize = 12 + t*20;
    const opacity = 0.55 + t*0.45;
    return `<span style="font-size:${fontSize.toFixed(0)}px;opacity:${opacity.toFixed(2)};">${escapeHtml(word)}</span>`;
  }).join('')}</div>`;
}

function rarityCounts(es){
  const counts = {};
  RARITY_TIER_NAMES.forEach(t=>counts[t]=0);
  es.forEach(e=>{
    const t = rarityTier(e.score).name;
    counts[t] = (counts[t]||0)+1;
  });
  return counts;
}
function rarityBarColor(tierName){
  const dummy = { score: tierName==='电子涅槃'?10:tierName==='灵魂共振'?9:tierName==='小型觉醒'?7.5:tierName==='凡夫俗子'?6:4 };
  return rarityTier(dummy.score);
}
const RARITY_GLASS_COLORS = {
  '戒断反射':'#7CC93E', '凡夫俗子':'#4FA3F0', '小型觉醒':'#A855F7', '灵魂共振':'#E8B23D'
};
const RARITY_GLASS_RAINBOW = 'linear-gradient(90deg,#F06BA8,#A855F7,#4FA3F0,#7CC93E,#E8B23D)';
function rarityGlassBarStyle(tierName){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(tierName==='电子涅槃'){
    return isDark
      ? `background-image:${RARITY_GLASS_RAINBOW};`
      : `background-image:linear-gradient(90deg,#D4537E,#9333EA,#378ADD,#639922,#BA7517);`;
  }
  const color = isDark ? RARITY_GLASS_COLORS[tierName] : rarityBarColor(tierName).color;
  return `background:${color};`;
}

function formatAchvExportTitle(title){
  const m = title.match(/^(\[[^\]]+\])\s*(.*)$/);
  if(!m) return escapeHtml(title);
  return `<span class="achv-export-tag">${escapeHtml(m[1])}</span><span class="achv-export-main">${escapeHtml(m[2])}</span>`;
}

function showNextAchvModal(){
  if(achvShowing && !document.querySelector('.achv-modal-overlay')) achvShowing = false;
  if(achvShowing || !achvQueue.length) return;
  const a = achvQueue.shift();
  achvShowing = true;
  const modal = document.createElement('div');
  modal.className = 'achv-modal-overlay';
  modal.innerHTML = `
    <div class="achv-modal-card">
      <div class="recap-grid-noise"></div>
      <div class="recap-scanlines"></div>
      <div class="recap-bracket tl"></div>
      <div class="recap-bracket br"></div>
      <div class="achv-modal-eyebrow">成 就 解 锁</div>
      <div class="achv-modal-title">${formatAchvTitle(a.title)}</div>
      <div class="achv-modal-desc">${a.flavor || ''}</div>
      <div class="achv-modal-actions">
        <button class="achv-modal-save-btn" type="button">保存图片</button>
        <button class="achv-modal-btn" type="button">好耶</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  requestAnimationFrame(()=> modal.classList.add('show'));
  const close = ()=>{
    modal.classList.remove('show');
    setTimeout(()=>{
      modal.remove();
      achvShowing = false;
      showNextAchvModal();
    }, 240);
  };
  modal.querySelector('.achv-modal-btn').addEventListener('click', close);
  modal.querySelector('.achv-modal-save-btn').addEventListener('click', ()=> exportAchvImage(a));
  modal.addEventListener('click', e=>{ if(e.target === modal) close(); });
}

async function exportAchvImage(a){
  if(typeof html2canvas === 'undefined'){
    showToast('分享卡组件加载失败，检查一下网络');
    return;
  }
  const card = document.createElement('div');
  card.className = 'achv-export-card';
  card.innerHTML = `
    <div class="achv-export-bracket tl"></div>
    <div class="achv-export-bracket br"></div>
    <div class="achv-export-eyebrow">成 就 解 锁</div>
    ${formatAchvExportTitle(a.title)}
    ${a.flavor ? `<div class="achv-export-desc">${escapeHtml(a.flavor)}</div>` : ''}
    <div class="achv-export-footer">仿生人会梦见电子烟吗</div>
  `;
  document.body.appendChild(card);
  await new Promise(r => requestAnimationFrame(()=> requestAnimationFrame(r)));
  try{
    const canvas = await html2canvas(card, { backgroundColor: '#170F1A', scale: 2 });
    const link = document.createElement('a');
    link.download = '成就解锁.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('已保存成就图片');
  }catch(err){
    showToast('导出失败：' + (err.message || '未知错误'));
  }finally{
    card.remove();
  }
}

async function getPersonalEntriesForAchievements(){
  if(activeRoom === 'personal') return entries;
  if(!config.personalCode) return [];
  try{
    const { data, error } = await sb.from('entries').select('*').eq('room_code', config.personalCode);
    if(error) throw error;
    return (data||[]).map(row => ({...row.data, id: row.id, author: row.author, createdAt: new Date(row.created_at).getTime()}));
  }catch(e){
    showToast('加载成就数据失败：' + (e.message || '网络问题'));
    return [];
  }
}

function previewAchvModal(a){
  const modal = document.createElement('div');
  modal.className = 'achv-modal-overlay';
  modal.innerHTML = `
    <div class="achv-modal-card">
      <div class="recap-grid-noise"></div>
      <div class="recap-scanlines"></div>
      <div class="recap-bracket tl"></div>
      <div class="recap-bracket br"></div>
      <div class="achv-modal-eyebrow">成 就 解 锁</div>
      <div class="achv-modal-title">${formatAchvTitle(a.title)}</div>
      <div class="achv-modal-desc">${a.flavor || ''}</div>
      <button class="achv-modal-btn" type="button">好耶</button>
    </div>
  `;
  document.body.appendChild(modal);
  requestAnimationFrame(()=> modal.classList.add('show'));
  const close = ()=>{
    modal.classList.remove('show');
    setTimeout(()=> modal.remove(), 240);
  };
  modal.querySelector('.achv-modal-btn').addEventListener('click', close);
  modal.addEventListener('click', e=>{ if(e.target === modal) close(); });
}

async function openAchievementsPanel(){
  const personalEntries = await getPersonalEntriesForAchievements();
  const unlockedCount = ACHIEVEMENTS.filter(a=>a.check(personalEntries)).length;
  const hiddenUnlocked = HIDDEN_ACHIEVEMENTS.filter(a=>a.check(personalEntries));
  panel.innerHTML = `
    <div class="panel-head">
      <h2>成就墙</h2>
      <div class="close-btn" id="closePanel">✕</div>
    </div>
    <div class="hint-text" style="margin-bottom:16px;">已解锁 ${unlockedCount} / ${ACHIEVEMENTS.length}（基于你的私人测评记录）</div>
    <div class="badge-list">
      ${ACHIEVEMENTS.map(a=>{
        const unlocked = a.check(personalEntries);
        return `
        <div class="badge-card ${unlocked?'unlocked':'locked'}">
          ${unlocked ? `<div class="badge-title">${a.title}</div>` : `<div class="badge-redacted"></div>`}
          <div class="badge-desc">${a.desc}</div>
          <div class="badge-progress">${unlocked ? '已解锁' : a.progress(personalEntries)}</div>
          ${unlocked ? `<div style="display:flex;gap:6px;margin-top:8px;"><button type="button" class="mini-btn badge-export-btn" data-id="${a.id}">自动保存</button><button type="button" class="mini-btn badge-preview-btn" data-id="${a.id}">查看大图</button></div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="hint-text" style="margin:20px 0 10px;">隐藏成就 · ${hiddenUnlocked.length} / ${HIDDEN_ACHIEVEMENTS.length}</div>
    <div class="badge-list">
      ${HIDDEN_ACHIEVEMENTS.map(a=>{
        const unlocked = a.check(personalEntries);
        return `
        <div class="badge-card ${unlocked?'unlocked':'locked'}">
          ${unlocked ? `<div class="badge-title">${a.title}</div>` : `<div class="badge-redacted"></div>`}
          <div class="badge-desc">${unlocked ? a.desc : '？？？'}</div>
          <div class="badge-progress">${unlocked ? '已解锁' : '未知'}</div>
          ${unlocked ? `<div style="display:flex;gap:6px;margin-top:8px;"><button type="button" class="mini-btn badge-export-btn" data-id="${a.id}">自动保存</button><button type="button" class="mini-btn badge-preview-btn" data-id="${a.id}">查看大图</button></div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('closePanel').addEventListener('click', closePanel);
  panel.querySelectorAll('.badge-export-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = ALL_ACHIEVEMENTS.find(x=>x.id===btn.dataset.id);
      if(a) exportAchvImage(a);
    });
  });
  panel.querySelectorAll('.badge-preview-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = ALL_ACHIEVEMENTS.find(x=>x.id===btn.dataset.id);
      if(a) previewAchvModal(a);
    });
  });
}

document.getElementById('addBtn').addEventListener('click', openAddPanel);
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('settingsBtn').addEventListener('click', openSettingsPanel);
document.getElementById('achievementsBtn').addEventListener('click', openAchievementsPanel);
document.getElementById('recapBtn').addEventListener('click', ()=> openRecapPanel('quarter'));
document.getElementById('graveyardBtn').addEventListener('click', openGraveyardPanel);
overlay.addEventListener('click', (e)=>{
  if(e.target===overlay){
    const hasClose = panel.querySelector('.close-btn');
    if(hasClose) closePanel();
  }
});

/* ---------- init ---------- */
(async function init(){
  loadConfig();
  renderTabs();
  if(!config.nickname || !config.personalCode){
    if(!config.personalCode) config.personalCode = randomCode();
    renderSettingsForm(true);
    return;
  }
  await loadEntries();
})();
</script>
